name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Run doc tests
        run: cargo test --doc

  # Every Rust file carries the copyright and the RPL 1.5 License Notice (the RPL's Exhibit A).
  license-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every Rust file carries the RPL License Notice
        run: |
          missing=$(git ls-files '*.rs' | xargs grep -L 'subject to the Reciprocal Public License ("RPL") Version 1.5' || true)
          if [ -n "$missing" ]; then
            echo "::error::Add the copyright and the RPL License Notice, as at the top of the other Rust files, to:"
            echo "$missing"
            exit 1
          fi
